[package]
name = "bacnet-mcp"
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/jscott3201/rusty-bacnet-mcp"
homepage = "https://github.com/jscott3201/rusty-bacnet-mcp"
description = "Dedicated MCP server for agentic interaction with BACnet building automation networks"
keywords = ["bacnet", "building-automation", "mcp", "agentic", "iot"]
categories = ["network-programming"]
authors = ["Justin Scott <jscott3201@gmail.com>"]
publish = false

[[bin]]
name = "bacnet-mcp"
path = "src/main.rs"
required-features = ["bin"]

[dependencies]
bacnet-types     = "0.8"
bacnet-encoding  = "0.8"
bacnet-services  = "0.8"
bacnet-transport = "0.8"
bacnet-network   = "0.8"
bacnet-client    = "0.8"
bacnet-objects   = "0.8"
bacnet-server    = "0.8"

bytes      = "1"
tokio      = { version = "1", features = ["net", "rt", "rt-multi-thread", "sync", "macros", "time", "signal", "fs", "io-std"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tracing    = "0.1"
arc-swap    = "1"
parking_lot = "0.12"

# mcp feature — server, transports, and HTTP glue (axum) for the streamable-HTTP transport
rmcp     = { version = "1.6", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session", "tower"], optional = true }
schemars = { version = "1", optional = true }
axum     = { version = "0.8", optional = true }
tower    = { version = "0.5", optional = true }
subtle   = { version = "2", optional = true }

# tui feature — ratatui ecosystem for the operator console
# Pinned to ratatui 0.29 so we can reuse tui-textarea and tui-widgets, which
# lag the 0.30 release. We ship our own LogLayer instead of pulling tui-logger.
ratatui      = { version = "0.29", optional = true }
crossterm    = { version = "0.28", features = ["event-stream"], optional = true }
tui-widgets  = { version = "0.4", optional = true }
tui-textarea = { version = "0.7", optional = true }
color-eyre   = { version = "0.6", optional = true }
futures      = { version = "0.3", optional = true }

# bin feature
clap               = { version = "4", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tokio-util         = { version = "0.7", features = ["rt"], optional = true }

[dev-dependencies]
tokio    = { version = "1", features = ["net", "rt", "sync", "macros", "time", "test-util"] }
rmcp     = { version = "1.6", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "tower"] }
schemars = "1"
axum     = "0.8"
tower    = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
subtle   = "2"

[features]
# Library consumers wanting config-only with no MCP/web deps: default-features = false.
default = ["mcp"]
mcp     = ["dep:rmcp", "dep:schemars", "dep:axum", "dep:tower", "dep:subtle"]
tui     = [
    "dep:ratatui",
    "dep:crossterm",
    "dep:tui-widgets",
    "dep:tui-textarea",
    "dep:color-eyre",
    "dep:futures",
]
bin     = ["mcp", "tui", "dep:clap", "dep:tracing-subscriber", "dep:tokio-util"]
# BACnet/SC transport (forwards to bacnet-transport's TLS WebSocket support).
sc      = ["bacnet-transport/sc-tls"]
