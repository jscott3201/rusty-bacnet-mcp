[package]
name = "bacnet-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/jscott3201/rusty-bacnet-mcp"
homepage = "https://github.com/jscott3201/rusty-bacnet-mcp"
description = "BACnet HTTP REST API and MCP server gateway for AI-driven building automation"
keywords = ["bacnet", "building-automation", "gateway", "mcp", "rest-api"]
categories = ["network-programming", "web-programming::http-server"]
authors = ["Justin Scott <jscott3201@gmail.com>"]
publish = false

[[bin]]
name = "bacnet-gateway"
path = "src/main.rs"
required-features = ["bin"]

[dependencies]
bacnet-types     = "0.8"
bacnet-encoding  = "0.8"
bacnet-services  = "0.8"
bacnet-transport = "0.8"
bacnet-network   = "0.8"
bacnet-client    = "0.8"
bacnet-objects   = "0.8"
bacnet-server    = "0.8"

bytes = "1"
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "sync", "macros", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"

# http feature
axum   = { version = "0.8", optional = true }
tower  = { version = "0.5", optional = true }
subtle = { version = "2",   optional = true }

# mcp feature
rmcp     = { version = "~1.2", features = ["server", "transport-streamable-http-server"], optional = true }
schemars = { version = "1", optional = true }

# bin feature
clap               = { version = "4",   features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tokio-util         = { version = "0.7", features = ["rt"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["net", "rt", "sync", "macros", "time", "test-util"] }
http-body-util = "0.1"
tower    = { version = "0.5", features = ["util"] }
axum     = "0.8"
subtle   = "2"
rmcp     = { version = "~1.2", features = ["server", "transport-streamable-http-server"] }
schemars = "1"

[features]
# Standalone repo flips the default to ["http", "mcp"] — library consumers who
# want config-only can opt out with default-features = false.
default = ["http", "mcp"]
http    = ["dep:axum", "dep:tower", "dep:subtle"]
mcp     = ["dep:rmcp", "dep:schemars"]
bin     = ["http", "mcp", "dep:clap", "dep:tracing-subscriber", "dep:tokio-util"]
sc-tls  = ["bacnet-transport/sc-tls"]
serial  = ["bacnet-transport/serial"]
