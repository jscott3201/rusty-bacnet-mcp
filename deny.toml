[graph]
targets = []
all-features = true
no-default-features = false

[advisories]
ignore = [
    # `paste` is unmaintained (no known CVE). Pulled in transitively by
    # ratatui 0.29's macro infrastructure. We're pinned to ratatui 0.29 because
    # tui-textarea / tui-widgets still lag the 0.30 release line; revisit when
    # the ratatui 0.30 ecosystem catches up. See CLAUDE.md "tui feature".
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "Unlicense",
]
exceptions = [
    { allow = ["OpenSSL"], crate = "aws-lc-sys" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
