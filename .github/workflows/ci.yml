# CI for bacnet-mcp.
#
# Patterns adopted from selene-db: PR-driven trigger, draft-PR skip, Cargo.lock
# guards on advisory checks, file-size cap (700 LOC) and no-secret scan as
# dedicated jobs, --locked flags for reproducibility, minimum-privilege
# permissions. Multi-OS test matrix is retained for main, tags, and manual
# runs; development PRs stay lean and skip the OS test matrix plus release
# build.
#
# Security notes:
#   - No `${{ github.event.* }}` interpolations appear in any `run:` command;
#     all such expansions are confined to `if:` conditions, `concurrency:`
#     keys, and `with:` action inputs. No shell-injection surface.

name: ci

on:
  pull_request:
    branches: [main, development]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, development]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUSTFLAGS: "-Dwarnings"

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --features bin,sc --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    if: >-
      (github.event.pull_request.draft == false || github.event_name != 'pull_request') &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.ref, 'refs/tags/') ||
       github.ref == 'refs/heads/main' ||
       github.base_ref == 'main')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --features bin,sc --locked
      - run: cargo test --doc --features bin,sc --locked

  build-bin:
    name: build-bin
    if: >-
      (github.event.pull_request.draft == false || github.event_name != 'pull_request') &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.ref, 'refs/tags/') ||
       github.ref == 'refs/heads/main' ||
       github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-bin
      - run: cargo build --release --features bin --locked

  docker-build:
    name: docker-build
    if: >-
      (github.event.pull_request.draft == false || github.event_name != 'pull_request') &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.ref, 'refs/tags/') ||
       github.ref == 'refs/heads/main' ||
       github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/docker-ci.sh

  deny:
    name: cargo-deny
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cargo-lock
        run: |
          if [ -f Cargo.lock ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cargo-lock.outputs.exists == 'false'
        run: echo "No Cargo.lock yet; cargo-deny starts once dependencies land."
      - uses: EmbarkStudios/cargo-deny-action@v2
        if: steps.cargo-lock.outputs.exists == 'true'
        with:
          command: check bans licenses sources

  audit:
    name: cargo-audit
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cargo-lock
        run: |
          if [ -f Cargo.lock ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cargo-lock.outputs.exists == 'false'
        run: echo "No Cargo.lock yet; cargo-audit starts once dependencies land."
      - uses: taiki-e/install-action@v2
        if: steps.cargo-lock.outputs.exists == 'true'
        with:
          tool: cargo-audit
      - uses: actions/cache@v4
        if: steps.cargo-lock.outputs.exists == 'true'
        with:
          path: ~/.cargo/advisory-db
          key: advisory-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: advisory-db-${{ runner.os }}-
      - if: steps.cargo-lock.outputs.exists == 'true'
        run: cargo audit --color always

  file-size-cap:
    name: file-size cap (700 LOC)
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-file-size.sh

  no-secret-scan:
    name: no-secret scan
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-no-secrets.sh
